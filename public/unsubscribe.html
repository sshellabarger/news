<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe — Dirty Dogtown</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; background: #f3f2f2; color: #201e1d;
    font-family: "Source Serif 4", Georgia, serif; display: grid;
    place-items: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; width: 100%; text-align: center; }
  h1 { font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.6; margin: 0 0 22px; opacity: 0.85; }
  form { display: grid; gap: 10px; text-align: left; }
  input { font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid rgba(32,30,29,0.25);
    border-radius: 2px; background: #eae9e9; width: 100%; box-sizing: border-box; }
  button { font: inherit; font-size: 14px; cursor: pointer; padding: 9px 16px;
    border: 1px solid rgba(32,30,29,0.25); background: transparent; border-radius: 2px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .sub-note { font-size: 13px; opacity: 0.7; min-height: 1.2em; }
  a { color: #006786; }
</style>
</head>
<body>
<main>
  <h1>Unsubscribe</h1>
  <p>Enter the address that gets the daily digest and it stops after today.</p>
  <form id="unsub-form">
    <input type="email" name="email" required placeholder="you@example.com" aria-label="Email to unsubscribe">
    <button type="submit">Stop the daily email</button>
    <span class="sub-note"></span>
  </form>
  <p style="margin-top:26px"><a href="/">← Back to Dirty Dogtown</a></p>
</main>
<script src="/firebase-config.js"></script>
<script type="module" src="/subscribe.js"></script>
</body>
</html>
